    <g transform="translate(1270 1074)" fill="none" stroke="#00aeb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="10"/><path d="M13 7v7l5 3M22 22l6 6"/></g>
    <g transform="translate(420 1209)" fill="none" stroke="#8c66e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="20" height="17" rx="5"/><path d="M14 7V2M10 2h8M9 15h1M18 15h1M10 20h8"/><circle cx="14" cy="2" r="2"/></g>
    <g transform="translate(845 1209)" fill="none" stroke="#f19a36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 1l12 7v14l-12 7-12-7V8zM2 8l12 7 12-7M14 15v14"/></g>
    <g transform="translate(1270 1209)" fill="none" stroke="#2d7cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M19 19l8 8M8 12h8M12 8v8"/></g>
  </g>

  <text x="80" y="1370" class="cn section">17 周路线</text>
