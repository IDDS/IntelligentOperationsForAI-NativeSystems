<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2050" viewBox="0 0 1400 2050">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5fb"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5efff"/><stop offset="1" stop-color="#f1f7ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#24476b" flood-opacity=".20"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="heroClip"><rect x="775" y="490" width="485" height="235" rx="20"/></clipPath>
    <style>
      .cn{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#122342}
      .muted{fill:#60738d}.eyebrow{font-size:20px;letter-spacing:5px;font-weight:700}.title{font-size:76px;font-weight:850;letter-spacing:1px}.sub{font-size:24px;letter-spacing:1px}.heroHead{font-size:34px;font-weight:850}.heroBody{font-size:18px}.metric{font-size:42px;font-weight:850}.metricLabel{font-size:16px}.section{font-size:26px;font-weight:850}.cardTitle{font-size:24px;font-weight:850}.cardText{font-size:17px}.small{font-size:16px}.foot{font-size:17px}.pill{font-size:17px;font-weight:750;letter-spacing:1px}
    </style>
  </defs>

  <rect width="1400" height="2050" fill="url(#bg)"/>
  <g opacity=".28" stroke="#c5d5e7"><path d="M0 165H1400M0 365H1400M0 565H1400M0 765H1400M0 965H1400M0 1165H1400M0 1365H1400M0 1565H1400M0 1765H1400M0 1965H1400"/><path d="M100 0V2050M350 0V2050M600 0V2050M850 0V2050M1100 0V2050M1350 0V2050"/></g>
  <circle cx="1170" cy="160" r="300" fill="#d9e9ff" opacity=".72"/><circle cx="90" cy="1770" r="310" fill="#d8f5f0" opacity=".65"/>

  <text x="80" y="72" class="cn eyebrow" style="fill:#008f92">SYSU × ENTERPRISE</text>
  <text x="1320" y="70" text-anchor="end" class="cn small muted">研究生校企联合课程 · 2026 秋季</text>
  <rect x="80" y="108" width="1240" height="4" fill="#1b86b8"/>

  <text x="80" y="220" class="cn title">面向 AI 原生系统</text>
  <text x="80" y="310" class="cn title">的智能运维</text>
  <text x="84" y="366" class="cn sub muted">Intelligent Operations for AI-Native Systems</text>
  <text x="84" y="420" class="cn" style="font-size:23px">把大模型、GPU 集群、可观测性与 Agent 工程连成一条学习主线</text>

  <!-- Hero -->
  <g filter="url(#shadow)">
    <rect x="80" y="465" width="1240" height="300" rx="28" fill="url(#hero)" stroke="#4b8dff" stroke-width="2"/>
    <circle cx="178" cy="542" r="57" fill="#2d7cff" opacity=".25" filter="url(#glow)"/><text x="178" y="554" text-anchor="middle" class="cn" style="font-size:34px;font-weight:850">LLM</text>
    <text x="275" y="535" class="cn heroHead">从一个模型，到一支会协作的</text>
    <text x="275" y="578" class="cn heroHead">Agent 团队</text>
    <text x="275" y="624" class="cn heroBody muted">Reasoning · Memory · Tools · Evidence</text>
    <text x="275" y="660" class="cn heroBody muted">让每一次调查都可解释、可验证、可回放。</text>
    <rect x="735" y="485" width="555" height="260" rx="24" fill="#e5efff" stroke="#cfe0f6" stroke-width="2"/>
    <image href="course-poster-multiagent-hero-cropped.png" x="775" y="490" width="485" height="235" preserveAspectRatio="xMidYMid meet" clip-path="url(#heroClip)" style="mix-blend-mode:multiply"/>
    <text x="1015" y="734" text-anchor="middle" class="cn small muted">Planner · Retriever · Tool Agent · Verifier</text>
  </g>

  <!-- Metrics -->
  <g filter="url(#shadow)">
    <rect x="80" y="810" width="1240" height="126" rx="25" fill="#fff" stroke="#4b8dff" stroke-width="2"/>
    <g transform="translate(130 835)"><text x="0" y="43" class="cn metric">34</text><text x="0" y="75" class="cn metricLabel muted">总学时</text><line x1="240" y1="0" x2="240" y2="78" stroke="#c2d1e6"/><text x="300" y="43" class="cn metric">17</text><text x="300" y="75" class="cn metricLabel muted">周次</text><line x1="500" y1="0" x2="500" y2="78" stroke="#c2d1e6"/><text x="560" y="43" class="cn metric">6</text><text x="560" y="75" class="cn metricLabel muted">能力主线</text><line x1="760" y1="0" x2="760" y2="78" stroke="#c2d1e6"/><text x="820" y="43" class="cn metric">2</text><text x="820" y="75" class="cn metricLabel muted">学分</text></g>
  </g>

  <text x="80" y="1010" class="cn section">六个关键词 · 从系统到调查</text>
  <g filter="url(#shadow)">
    <rect x="80" y="1045" width="390" height="105" rx="20" fill="#fff" stroke="#4b8dff" stroke-width="2"/><circle cx="125" cy="1095" r="23" fill="#2d7cff"/><text x="125" y="1103" text-anchor="middle" class="cn" style="fill:#fff;font-weight:850">01</text><text x="170" y="1089" class="cn cardTitle">LLM Serving &amp; GPU</text><text x="170" y="1122" class="cn cardText muted">Prefill · Decode · KV Cache</text>
    <rect x="505" y="1045" width="390" height="105" rx="20" fill="#fff" stroke="#35d0ca" stroke-width="2"/><circle cx="550" cy="1095" r="23" fill="#00b9bd"/><text x="550" y="1103" text-anchor="middle" class="cn" style="fill:#fff;font-weight:850">02</text><text x="595" y="1089" class="cn cardTitle">Observability</text><text x="595" y="1122" class="cn cardText muted">OTel · Prometheus · Langfuse</text>
    <rect x="930" y="1045" width="390" height="105" rx="20" fill="#fff" stroke="#35d0ca" stroke-width="2"/><circle cx="975" cy="1095" r="23" fill="#00b9bd"/><text x="975" y="1103" text-anchor="middle" class="cn" style="fill:#fff;font-weight:850">03</text><text x="1020" y="1089" class="cn cardTitle">Detection &amp; RCA</text><text x="1020" y="1122" class="cn cardText muted">异常 · 事件 · 因果</text>
    <rect x="80" y="1180" width="390" height="105" rx="20" fill="#fff" stroke="#be96ff" stroke-width="2"/><circle cx="125" cy="1230" r="23" fill="#8c66e8"/><text x="125" y="1238" text-anchor="middle" class="cn" style="fill:#fff;font-weight:850">04</text><text x="170" y="1224" class="cn cardTitle">AgentOps</text><text x="170" y="1257" class="cn cardText muted">ReAct · Tools · Memory</text>
    <rect x="505" y="1180" width="390" height="105" rx="20" fill="#fff" stroke="#ffbd6b" stroke-width="2"/><circle cx="550" cy="1230" r="23" fill="#f19a36"/><text x="550" y="1238" text-anchor="middle" class="cn" style="fill:#fff;font-weight:850">05</text><text x="595" y="1224" class="cn cardTitle">AI-Native Objects</text><text x="595" y="1257" class="cn cardText muted">对象 · 事件 · Profiling</text>
    <rect x="930" y="1180" width="390" height="105" rx="20" fill="#fff" stroke="#6ca4ff" stroke-width="2"/><circle cx="975" cy="1230" r="23" fill="#2d7cff"/><text x="975" y="1238" text-anchor="middle" class="cn" style="fill:#fff;font-weight:850">06</text><text x="1020" y="1224" class="cn cardTitle">Investigation Trace</text><text x="1020" y="1257" class="cn cardText muted">主动查询 · 竞争性假设</text>

    <!-- compact line icons -->
    <g transform="translate(420 1074)" fill="none" stroke="#2d7cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="4" width="27" height="20" rx="3"/><path d="M7 4V0M14 4V0M21 4V0M7 24v4M14 24v4M21 24v4M0 11h27M10 15h7v5h-7z"/></g>
