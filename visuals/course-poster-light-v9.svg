  <g filter="url(#shadow)"><rect x="80" y="1600" width="1240" height="105" rx="20" fill="#102e60" stroke="#00c6bd"/><text x="115" y="1644" class="cn" style="font-size:20px;font-weight:850;fill:#fff">你将带走</text><text x="300" y="1644" class="cn" style="font-size:18px;fill:#fff">可观测调用链</text><text x="550" y="1644" class="cn" style="font-size:18px;fill:#fff">RCA 证据包</text><text x="770" y="1644" class="cn" style="font-size:18px;fill:#fff">安全修复工作流</text><text x="1070" y="1644" class="cn" style="font-size:18px;fill:#fff">可回放知识</text><text x="115" y="1680" class="cn small" style="fill:#bfe7ff">从“模型输出”走向“可解释、可验证、可运营”。</text></g>

