  <g><rect x="80" y="1845" width="1240" height="86" rx="18" fill="#0e2852" stroke="#5276b7"/><text x="110" y="1880" class="cn small">01–02 架构/失败</text><text x="300" y="1880" class="cn small">03–05 观测</text><text x="470" y="1880" class="cn small">06–08 检测/RCA</text><text x="680" y="1880" class="cn small">09–14 Agent/平台</text><text x="930" y="1880" class="cn small">15–16 对象/事件</text><text x="1170" y="1880" class="cn small">17 调查</text><line x1="110" y1="1900" x2="1260" y2="1900" stroke="#4b8dff" stroke-width="6"/><circle cx="120" cy="1900" r="10" fill="#4b8dff"/><circle cx="330" cy="1900" r="10" fill="#4b8dff"/><circle cx="560" cy="1900" r="10" fill="#35d0ca"/><circle cx="820" cy="1900" r="10" fill="#be96ff"/><circle cx="1040" cy="1900" r="10" fill="#be96ff"/><circle cx="1260" cy="1900" r="10" fill="#ffbd6b"/></g>
