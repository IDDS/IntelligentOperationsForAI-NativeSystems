  <text x="80" y="1090" class="cn section" style="font-size:21px">五个生产问题 · 作为课程导航</text>
  <g filter="url(#shadow3)">
    <rect x="80" y="1120" width="240" height="78" rx="16" fill="#173e78" stroke="#6ca4ff"/><text x="105" y="1152" class="cn" style="font-size:15px;font-weight:700">01 系统由什么组成？</text><text x="105" y="1176" class="cn" style="font-size:13px;fill:#b8c9e5">模型 · 数据 · GPU · Agent</text>
    <rect x="340" y="1120" width="240" height="78" rx="16" fill="#173e78" stroke="#6ca4ff"/><text x="365" y="1152" class="cn" style="font-size:15px;font-weight:700">02 应该观察什么？</text><text x="365" y="1176" class="cn" style="font-size:13px;fill:#b8c9e5">Metrics · Logs · Trace</text>
    <rect x="600" y="1120" width="240" height="78" rx="16" fill="#173e78" stroke="#6ca4ff"/><text x="625" y="1152" class="cn" style="font-size:15px;font-weight:700">03 谁最值得检查？</text><text x="625" y="1176" class="cn" style="font-size:13px;fill:#b8c9e5">候选 · 因果 · 反证</text>
    <rect x="860" y="1120" width="240" height="78" rx="16" fill="#283a78" stroke="#bd95ff"/><text x="885" y="1152" class="cn" style="font-size:15px;font-weight:700">04 Agent 如何行动？</text><text x="885" y="1176" class="cn" style="font-size:13px;fill:#b8c9e5">工具 · 审批 · 回滚</text>
    <rect x="1120" y="1120" width="200" height="78" rx="16" fill="#283a78" stroke="#bd95ff"/><text x="1140" y="1152" class="cn" style="font-size:15px;font-weight:700">05 如何证明？</text><text x="1140" y="1176" class="cn" style="font-size:13px;fill:#b8c9e5">证据 · Outcome · 验证</text>
  </g>
  <g filter="url(#shadow3)"><rect x="80" y="1230" width="1240" height="92" rx="18" fill="#102e60" stroke="#00c6bd"/><text x="110" y="1262" class="cn" style="font-size:18px;font-weight:800">课程内容覆盖</text><text x="270" y="1262" class="cn" style="font-size:14px">大模型 · 后训练</text><text x="455" y="1262" class="cn" style="font-size:14px">训练并行 · 容错</text><text x="640" y="1262" class="cn" style="font-size:14px">LLM Serving · GPU</text><text x="850" y="1262" class="cn" style="font-size:14px">可观测性 · RCA</text><text x="1040" y="1262" class="cn" style="font-size:14px">Agent · 对象 · 事件</text><text x="110" y="1297" class="cn" style="font-size:14px;fill:#b8c9e5">从 token、KV Cache、GPU kernel 到 Agent Trace、因果图、Policy Gate、Rollback 和 Event Memory。</text></g>

  <text x="80" y="1435" class="cn section">六大能力模块 · 从系统到调查</text>
  <g filter="url(#shadow3)">
    <rect x="80" y="1470" width="390" height="120" rx="20" fill="#153a71" stroke="#4b8dff"/><circle cx="125" cy="1515" r="22" fill="#2d7cff"/><text x="125" y="1523" text-anchor="middle" class="cn" style="font-weight:800">01</text><text x="170" y="1513" class="cn cardTitle">LLM Serving &amp; GPU</text><text x="170" y="1545" class="cn cardText muted">Prefill · Decode · KV Cache · SLO</text><text x="170" y="1570" class="cn cardText muted">训练、推理、调度与硬件证据</text>
    <rect x="505" y="1470" width="390" height="120" rx="20" fill="#153a71" stroke="#35d0ca"/><circle cx="550" cy="1515" r="22" fill="#00b9bd"/><text x="550" y="1523" text-anchor="middle" class="cn" style="font-weight:800">02</text><text x="595" y="1513" class="cn cardTitle">Observability</text><text x="595" y="1545" class="cn cardText muted">OTel · Prometheus · Langfuse</text><text x="595" y="1570" class="cn cardText muted">跨服务、跨 GPU、跨模型调用链</text>
    <rect x="930" y="1470" width="390" height="120" rx="20" fill="#153a71" stroke="#35d0ca"/><circle cx="975" cy="1515" r="22" fill="#00b9bd"/><text x="975" y="1523" text-anchor="middle" class="cn" style="font-weight:800">03</text><text x="1020" y="1513" class="cn cardTitle">Detection &amp; RCA</text><text x="1020" y="1545" class="cn cardText muted">异常、事件、候选、因果</text><text x="1020" y="1570" class="cn cardText muted">从症状到可验证根因</text>
    <rect x="80" y="1615" width="390" height="120" rx="20" fill="#28376e" stroke="#be96ff"/><circle cx="125" cy="1660" r="22" fill="#8c66e8"/><text x="125" y="1668" text-anchor="middle" class="cn" style="font-weight:800">04</text><text x="170" y="1658" class="cn cardTitle">AgentOps</text><text x="170" y="1690" class="cn cardText muted">ReAct · Memory · Tools · HITL</text><text x="170" y="1715" class="cn cardText muted">工作流、权限、回放与多智能体</text>
    <rect x="505" y="1615" width="390" height="120" rx="20" fill="#28376e" stroke="#ffbd6b"/><circle cx="550" cy="1660" r="22" fill="#f19a36"/><text x="550" y="1668" text-anchor="middle" class="cn" style="font-weight:800">05</text><text x="595" y="1658" class="cn cardTitle">AI Native Objects</text><text x="595" y="1690" class="cn cardText muted">对象档案 · 事件记忆 · Profiling</text><text x="595" y="1715" class="cn cardText muted">让复杂系统变成可查询世界</text>
    <rect x="930" y="1615" width="390" height="120" rx="20" fill="#28376e" stroke="#6ca4ff"/><circle cx="975" cy="1660" r="22" fill="#2d7cff"/><text x="975" y="1668" text-anchor="middle" class="cn" style="font-weight:800">06</text><text x="1020" y="1658" class="cn cardTitle">Investigation Trace</text><text x="1020" y="1690" class="cn cardText muted">主动查询 · 竞争性假设</text><text x="1020" y="1715" class="cn cardText muted">让 Agent 给出可复核结论</text>
  </g>

