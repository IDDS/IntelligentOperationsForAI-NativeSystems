  <text x="80" y="78" class="cn eyebrow" fill="#64e1d5">SYSU × ENTERPRISE</text>
  <text x="1320" y="76" text-anchor="end" class="cn small muted">研究生校企联合课程 · 2026 秋季学期</text>
  <rect x="80" y="118" width="1240" height="4" fill="#1b86b8"/>

  <text x="80" y="240" class="cn title">面向 AI 原生系统</text>
  <text x="80" y="330" class="cn title">的智能运维</text>
  <text x="84" y="390" class="cn sub muted">Intelligent Operations for AI-Native Systems</text>
  <text x="84" y="458" class="cn" style="font-size:24px">一门连接大模型、GPU 集群、可观测性与 Agent 工程的研究生课程</text>

  <!-- hero: LLM + multi-agent -->
  <g filter="url(#shadow3)">
    <rect x="80" y="505" width="1240" height="325" rx="28" fill="url(#hero3)" stroke="#4b8dff" stroke-width="2"/>
    <circle cx="180" cy="580" r="58" fill="#2d7cff" opacity=".28" filter="url(#glow3)"/><text x="180" y="592" text-anchor="middle" class="cn" style="font-size:34px;font-weight:800">LLM</text>
    <text x="280" y="560" class="cn heroHead" style="font-size:31px">从一个模型，到一支会协作的</text>
    <text x="280" y="600" class="cn heroHead" style="font-size:31px">Agent 团队</text>
    <text x="280" y="642" class="cn heroBody muted">模型负责推理，Agent 负责分工；工具负责行动，</text>
    <text x="280" y="672" class="cn heroBody muted">观测与证据负责让每一步都能被解释、复盘和验证。</text>
    <g transform="translate(280 712)"><rect width="102" height="34" rx="17" fill="#2d7cff"/><text x="51" y="23" text-anchor="middle" class="cn pill">Reasoning</text><rect x="116" width="93" height="34" rx="17" fill="#00b9bd"/><text x="162" y="23" text-anchor="middle" class="cn pill">Memory</text><rect x="223" width="79" height="34" rx="17" fill="#8c66e8"/><text x="262" y="23" text-anchor="middle" class="cn pill">Tools</text><rect x="316" width="111" height="34" rx="17" fill="#f19a36"/><text x="371" y="23" text-anchor="middle" class="cn pill">Evidence</text></g>
    <rect x="745" y="490" width="530" height="292" rx="24" fill="#f5f6ff" opacity=".98"/>
    <image href="course-poster-multiagent-hero.png" x="760" y="505" width="500" height="265" preserveAspectRatio="xMidYMid meet" clip-path="url(#heroClip3)"/>
    <text x="1010" y="807" text-anchor="middle" class="cn small muted">Planner · Retriever · Tool Agent · Verifier</text>
  </g>

